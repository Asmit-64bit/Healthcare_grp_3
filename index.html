<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UroScan AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #1a365d;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
    }
    .login-title {
      text-align: center;
      margin-bottom: 15px;
      color: #1a365d;
    }
    .demo-box {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      padding: 10px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">
      <h2>UroScan AI</h2>
      <p style="font-size: 12px; color: #718096;">Point-of-Care Urinalysis Platform</p>
    </div>

    <div class="demo-box">
      <strong>Demo Login Credentials:</strong><br>
      Email: doctor@uroscan.demo<br>
      Password: demo123
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" value="doctor@uroscan.demo" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" value="demo123" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="margin-top: 15px; font-size: 11px; color: #718096; text-align: center;">
      Academic Prototype (KJS-HC-03) &bull; Simulated Data Only
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
  <script>
    $(document).ready(function() {
      $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        const email = $('#loginEmail').val().trim();
        const password = $('#loginPassword').val().trim();

        if (email && password) {
          localStorage.setItem('uroscan_auth', 'true');
          showToast('Login Successful', 'Welcome Dr. Ninad');
          setTimeout(function() {
            window.location.href = 'dashboard.html';
          }, 500);
        }
      });
    });
  </script>
</body>
</html>
